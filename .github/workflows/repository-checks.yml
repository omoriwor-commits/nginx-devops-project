name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install PyYAML==6.0.2 ruff==0.14.1
      - name: Check YAML and local documentation links
        run: python scripts/ci/check_repository.py
      - name: Lint Python correctness
        run: ruff check --select E9,F63,F7,F82 .
      - name: Build and smoke-test hardened container
        run: |
          docker build -t nginx-audit-test .
          docker run -d --name nginx-audit-test --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 nginx-audit-test
          trap 'docker logs nginx-audit-test; docker rm -f nginx-audit-test' EXIT
          curl --silent --show-error --fail --retry-all-errors --retry 10 --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
